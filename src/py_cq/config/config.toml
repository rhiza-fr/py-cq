[python.compile]
command = "{python} -m compileall -r 10 -j 8 \"{context_path}\" -x \".*venv|\\.claude\""
parser = "CompileParser"
order = 1
warning_threshold = 0.9999
error_threshold = 0.9999
cache_invariant = "ast"

[python.ruff]
command = "{python} -m ruff check --output-format concise --no-cache \"{context_path}\" --extend-exclude .claude{exclude}"
exclude_format = " --extend-exclude {path}"
parser = "RuffParser"
order = 2
warning_threshold = 0.9999
error_threshold = 0.9

[python.ty]
command = "{python} -m ty check --output-format concise --color never \"{context_path}\" --exclude .claude{exclude}"
exclude_format = " --exclude {path}"
parser = "TyParser"
order = 3
warning_threshold = 0.9999
error_threshold = 0.8
run_in_target_env = true
extra_deps = ["ty"]

[python.bandit]
command = "{python} -m bandit -r {scan_targets} -f json -q -s B101 --severity-level medium{exclude}"
scan_exclude_names = [".venv", ".claude", "tests"]
exclude_format = " --exclude {abs_native_path}"
parser = "BanditParser"
order = 4
warning_threshold = 0.9999
error_threshold = 0.8

[python.kingfisher]
command = "kingfisher scan \"{context_path}\" --no-validate --no-update-check --git-history none --no-extract-archives --redact -q -f json --exclude .venv --exclude .git --exclude .hypothesis --exclude dist --exclude \"*_cache\" --exclude __pycache__ --exclude .claude{exclude}"
exclude_format = " --exclude {path}"
parser = "KingfisherParser"
order = 5
warning_threshold = 0.9999
error_threshold = 0.9999

[python.uv-audit]
command = "uv audit --project \"{abs_context_path}\" --frozen --output-format json"
parser = "UvAuditParser"
order = 6
warning_threshold = 0.9999
error_threshold = 0.8
skip_for_file = true

[python.pytest]
command = "{python} -m pytest -vv{test_target} --ignore .claude{exclude}"
exclude_format = " --ignore {path}"
parser = "PytestParser"
order = 7
warning_threshold = 1.0
error_threshold = 1.0
run_in_target_env = true
extra_deps = ["pytest"]
skip_for_file = true
cache_invariant = "ast"

[python.coverage]
command = "{python} -m coverage run --omit=*/tests/*,*/test_*.py,*/py_cq/runners/* \"{pytest_serial}\"{test_target} --ignore .claude{exclude} && {python} -m coverage report --show-missing --include=./* --omit=*/tests/*,*/test_*.py,*/py_cq/runners/*"
exclude_format = " --ignore {path}"
parser = "CoverageParser"
order = 8
warning_threshold = 0.9
error_threshold = 0.5
run_in_target_env = true
extra_deps = ["coverage", "pytest"]
skip_for_file = true
skip_if = "pytest"
cache_invariant = "ast"

[python.vulture]
command = "{python} -m vulture \"{context_path}\" --min-confidence 60 --exclude .venv,dist,.*_cache,docs,.git,.claude{exclude}"
exclude_format = ",{path}"
parser = "VultureParser"
order = 9
warning_threshold = 0.9999
error_threshold = 0.8
cache_invariant = "ast"

[python.interrogate]
command = "{python} -m interrogate \"{context_path}\" -e .claude -e \"{context_path}/tests\" -e \"{context_path}/test\"{exclude} -v --fail-under 0"
exclude_format = " -e {path}"
parser = "InterrogateParser"
order = 10
warning_threshold = 0.8
error_threshold = 0.5

[python.interrogate.parser_config]
skip_empty_init = true

[python.radon-cc]
command = "{python} -m radon cc --json --exclude '.claude/**' \"{context_path}\""
parser = "ComplexityParser"
order = 11
warning_threshold = 0.6
error_threshold = 0.4

[python.radon-mi]
command = "{python} -m radon mi -s --json --exclude '.claude/**' \"{context_path}\""
parser = "MaintainabilityParser"
order = 12
warning_threshold = 0.6
error_threshold = 0.4

[python.radon-hal]
command = "{python} -m radon hal -f --json --exclude '.claude/**' \"{context_path}\""
parser = "HalsteadParser"
order = 13
warning_threshold = 0.35
error_threshold = 0.3

[python.ruff-format]
command = "{python} -m ruff format --check --output-format concise --no-cache \"{context_path}\" --extend-exclude .claude --config \"include=['*.py','*.pyi','*.ipynb']\"{exclude}"
exclude_format = " --extend-exclude {path}"
parser = "RuffFormatParser"
order = 14
warning_threshold = 0.9999
error_threshold = 0.5
