[project]
name = "python-code-quality"
version = "0.1.6"
description = "Python Code Quality Analysis Tool - feed the results from 11 CQ CQ straight into an LLM."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Chris Kilner", email = "chris@rhiza.fr"}]

dependencies = [
    "bandit>=1.8.0",
    "coverage>=7.8.2",
    "diskcache>=5.6.3",
    "interrogate>=1.7.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
    "pytest-json-report>=1.5.0",
    "pyyaml>=6.0.2",
    "radon>=6.0.1",
    "rich>=14.0.0",
    "ruff>=0.14.1",
    "ty>=0.0.17",
    "typer>=0.16.0",
    "vulture>=2.14",
]

[project.urls]
Homepage = "https://github.com/rhiza-fr/py-cq"
Repository = "https://github.com/rhiza-fr/py-cq"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_cq"]

[project.scripts]
cq = "py_cq.main:main"
