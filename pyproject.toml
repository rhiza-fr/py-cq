[project]
name = "codeoptim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachier>=3.1.2",
    "coverage>=7.8.2",
    "pydocstyle>=6.3.0",
    "pylint>=3.3.7",
    "pyright>=1.1.401",
    "pytest>=8.4.0",
    "radon>=6.0.1",
    "rich>=14.0.0",
    "snakeviz>=2.2.2",
    "typer>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.12",
]
