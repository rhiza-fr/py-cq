tools:

  compilation:
    name: "compile"
    command: "{python} -m compileall -r 10 -j 8 -f {context_path} -x .*venv"
    parser: "CompileParser"
    priority: 1
    warning_threshold: 0.9999
    error_threshold: 0.9999

  bandit:
    name: "bandit"
    command: "{python} -m bandit -r {context_path} -f json -q"
    parser: "BanditParser"
    priority: 2
    warning_threshold: 0.9999
    error_threshold: 0.8

  ruff:
    name: "ruff"
    command: "{python} -m ruff check --output-format concise --no-cache {context_path}"
    parser: "RuffParser"
    priority: 3
    warning_threshold: 0.9999
    error_threshold: 0.9

  ty:
    name: "ty"
    command: "{python} -m ty check --output-format concise --color never {context_path}"
    parser: "TyParser"
    priority: 4
    warning_threshold: 0.9999
    error_threshold: 0.8
    run_in_target_env: true
    extra_deps:
      - ty

  pytest:
    name: "pytest"
    command: "{python} -m pytest -v {context_path}"
    parser: "PytestParser"
    priority: 5
    warning_threshold: 0.7
    error_threshold: 0.5
    run_in_target_env: true

  coverage:
    name: "coverage"
    command: "{python} -m coverage run -m pytest {context_path} && {python} -m coverage report"
    parser: "CoverageParser"
    priority: 6
    warning_threshold: 0.9
    error_threshold: 0.5
    run_in_target_env: true
    extra_deps:
      - coverage
      - pytest

  complexity:
    name: "radon cc"
    command: "{python} -m radon cc --json {context_path}"
    parser: "ComplexityParser"
    priority: 7
    warning_threshold: 0.6
    error_threshold: 0.4

  maintainability:
    name: "radon mi"
    command: "{python} -m radon mi -s --json {context_path}"
    parser: "MaintainabilityParser"
    priority: 8
    warning_threshold: 0.6
    error_threshold: 0.4

  halstead:
    name: "radon hal"
    command: "{python} -m radon hal -f --json {context_path}"
    parser: "HalsteadParser"
    priority: 9
    warning_threshold: 0.5
    error_threshold: 0.3

  vulture:
    name: "vulture"
    command: "{python} -m vulture {context_path} --min-confidence 80"
    parser: "VultureParser"
    priority: 10
    warning_threshold: 0.9999
    error_threshold: 0.8

  interrogate:
    name: "interrogate"
    command: "{python} -m interrogate {context_path} -v --fail-under 0"
    parser: "InterrogateParser"
    priority: 11
    warning_threshold: 0.8
    error_threshold: 0.3
